<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dori and the Echo in the Mist · 互動立體童書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Andika:wght@400;700&family=Noto+Sans+TC:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --wood:#8a5a2c; --wood-dark:#5f3b18; --wood-light:#b57a41;
  --night:#1c2044; --night-deep:#0f1230;
  --cream:#fbf3df; --cream-dark:#e9d9b3; --ink:#4b3a2a; --ink-soft:#7a6650;
  --gold:#f6c445; --gold-dark:#c9931b;
  --fox:#e8823a; --teal:#2f8f9d; --rose:#d9634f;
  --shadow:0 10px 26px rgba(20,12,4,.35);
  --h:'Baloo 2', 'Noto Sans TC', sans-serif;
  --b:'Andika', 'Noto Sans TC', sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2a1a0c;font-family:var(--b);color:var(--ink);overflow:hidden;user-select:none}
button{font-family:var(--h);cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- fixed canvas, scaled to fit ---------- */
#app{position:absolute;left:50%;top:50%;width:1040px;height:660px;transform-origin:center;
  background:
    radial-gradient(ellipse 65% 60% at 32% 22%, rgba(255,214,140,.55), transparent 70%),
    radial-gradient(ellipse 90% 70% at 50% 110%, rgba(0,0,0,.55), transparent 60%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 3px, transparent 3px 60px),
    linear-gradient(180deg,#a3652f,#7d4a20 55%,#5a3416);
  border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#app::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(88deg, transparent 0 40px, rgba(0,0,0,.05) 40px 42px)}

/* lamp glow (top-left) */
.lamp{position:absolute;left:36px;top:34px;width:150px;height:150px;pointer-events:none;z-index:1;filter:drop-shadow(0 12px 18px rgba(0,0,0,.35))}

/* ---------- top bar ---------- */
.brand{position:absolute;left:30px;top:22px;z-index:20;font:800 22px/1 var(--h);color:var(--cream);letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.35);display:flex;align-items:center;gap:8px}
.brand span{font-size:26px}
.stars{position:absolute;left:50%;top:22px;transform:translateX(-50%);display:flex;gap:6px;z-index:20;background:rgba(20,12,4,.45);padding:7px 14px;border-radius:20px}
.stars i{width:22px;height:22px;display:block;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%235b4025' d='M12 1.8l3 6.5 7 .9-5.1 4.9 1.3 7-6.2-3.5L5.8 21l1.3-7L2 9.2l7-.9z'/></svg>") center/contain no-repeat;opacity:.55;transition:transform .3s,opacity .3s}
.stars i.on{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23f6c445' stroke='%23c9931b' stroke-width='1' d='M12 1.8l3 6.5 7 .9-5.1 4.9 1.3 7-6.2-3.5L5.8 21l1.3-7L2 9.2l7-.9z'/></svg>");opacity:1}
.stars i.now{transform:scale(1.35)}
.topbtns{position:absolute;right:26px;top:18px;display:flex;gap:10px;z-index:20}
.round{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff8e8,#e6d3a8);box-shadow:0 3px 0 #a67d44,0 6px 12px rgba(0,0,0,.35);font-size:20px;display:grid;place-items:center;color:var(--ink);transition:transform .15s}
.round:active{transform:translateY(2px);box-shadow:0 1px 0 #a67d44,0 3px 8px rgba(0,0,0,.35)}
.round.off{opacity:.55}

/* ---------- 3D stage ---------- */
#stage{position:absolute;left:0;top:0;width:100%;height:100%;perspective:1400px;perspective-origin:50% 22%;z-index:5}
#book{position:absolute;left:50%;top:50%;width:640px;height:640px;margin:-300px 0 0 -260px;transform-style:preserve-3d;transform:rotateX(58deg) translateY(-26px);}
.page{position:absolute;left:0;width:640px;height:320px;transform-style:preserve-3d;background:linear-gradient(180deg,#fff9ea,#f5ebd2);box-shadow:inset 0 0 40px rgba(120,80,20,.18)}
.page.far{top:0;transform-origin:50% 100%;transform:rotateX(-47deg);border-radius:10px 10px 0 0}
.page.near{top:320px;transform-origin:50% 0;border-radius:0 0 10px 10px}
.page.near::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;background:linear-gradient(180deg,rgba(60,30,0,.28),transparent)}
.page.far::after{content:"";position:absolute;left:0;right:0;bottom:0;height:20px;background:linear-gradient(0deg,rgba(60,30,0,.25),transparent)}
/* book cover boards */
.board{position:absolute;left:-14px;width:668px;height:334px;background:linear-gradient(135deg,#24305e,#141a3a);border-radius:12px;box-shadow:0 6px 0 #0b0f24;transform:translateZ(-8px)}
.board.f{top:-14px;transform-origin:50% 100%;transform:rotateX(-47deg) translateZ(-8px)}
.board.n{top:320px}
.backdrop{position:absolute;inset:14px 14px 0 14px;overflow:hidden;border-radius:6px 6px 0 0;backface-visibility:hidden}
.backdrop svg{width:100%;height:100%;display:block}
.floor{position:absolute;inset:0;overflow:hidden}
.floor svg{position:absolute;inset:0;width:100%;height:100%}

/* pop-ups: stand vertically on the near page */
.pop{position:absolute;bottom:0;transform-origin:50% 100%;transform:rotateX(-60deg);transform-style:preserve-3d;will-change:transform;transition:transform .55s cubic-bezier(.34,1.56,.64,1)}
.pop.down{transform:rotateX(0deg) scaleY(.02)}
.pop svg{display:block;overflow:visible;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
.pop .shadow{position:absolute;left:10%;right:10%;bottom:-6px;height:26px;background:radial-gradient(ellipse,rgba(0,0,0,.35),transparent 70%);transform:rotateX(60deg);transform-origin:50% 100%;pointer-events:none}
.tag{position:absolute;left:50%;transform:translate(-50%,0);background:var(--cream);color:var(--ink);font:700 15px/1 var(--b);padding:6px 10px;border-radius:8px;border:2px dashed #b89a68;box-shadow:0 3px 8px rgba(0,0,0,.3);white-space:nowrap;cursor:pointer;opacity:0;transition:opacity .4s .4s}
.pop:not(.down) .tag{opacity:1}
.tag:hover{background:#fff}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotateX(-60deg) translateY(0)}50%{transform:rotateX(-60deg) translateY(-6px)}}
.pop.bob.down{animation:none}

/* page flip sheet */
.sheet{position:absolute;left:0;top:320px;width:640px;height:320px;transform-origin:50% 0;transform-style:preserve-3d;pointer-events:none;opacity:0}
.sheet .f,.sheet .b{position:absolute;inset:0;background:linear-gradient(180deg,#fff9ea,#f1e5c8);backface-visibility:hidden;border-radius:0 0 10px 10px;box-shadow:0 0 30px rgba(0,0,0,.2)}
.sheet .b{transform:rotateX(180deg);background:linear-gradient(0deg,#fff9ea,#f1e5c8)}
.sheet.go{opacity:1;animation:flip .9s cubic-bezier(.55,.1,.35,1) forwards}
.sheet.go.back{animation-name:flipback}
@keyframes flip{0%{transform:rotateX(0)}100%{transform:rotateX(-178deg)}}
@keyframes flipback{0%{transform:rotateX(-178deg)}100%{transform:rotateX(0)}}

/* ---------- story card ---------- */
#card{position:absolute;left:44px;top:150px;width:390px;padding:26px 28px 22px;background:linear-gradient(180deg,#fffaf0,#f8eed6);border-radius:8px;box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.7);z-index:15;transition:transform .35s,opacity .3s;cursor:zoom-in}
#card::before,#card::after{content:"❧";position:absolute;color:#c9a96a;font-size:20px;opacity:.7}
#card::before{left:10px;top:6px}#card::after{right:10px;bottom:6px;transform:rotate(180deg)}
#card.zoom{transform:scale(1.28) translate(60px,20px);cursor:zoom-out;z-index:30}
#card.hide{opacity:0;pointer-events:none}
.pageno{font:700 11px/1 var(--b);letter-spacing:2px;color:#a08862;margin-bottom:6px}
#title{font:800 27px/1.15 var(--h);color:#7a4b1f;margin:0 0 12px}
#text{font:400 22px/1.6 var(--b);color:var(--ink)}
.w{display:inline-block;padding:0 2px;border-radius:5px;cursor:pointer;transition:background .15s;border-bottom:2px dotted transparent}
.w.v{border-bottom-color:#c9a96a}
.w:hover{background:#fbe9b0}
.w.hl{background:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.w.said{background:#ffe9a8}
#zh{font:500 15px/1.6 'Noto Sans TC',sans-serif;color:#8b7150;margin-top:10px;padding-top:8px;border-top:1px dashed #d9c49b;display:none}
#zh.show{display:block}
.hint{font:400 11px/1 var(--b);color:#a08862;margin-top:14px}

/* vocab popup */
#vocab{position:absolute;left:300px;top:190px;width:230px;padding:16px 16px 12px;background:linear-gradient(180deg,#fffdf6,#f5e9cf);border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 0 0 4px #fff,inset 0 0 0 6px #e6d2a4;z-index:32;text-align:center;transform:scale(.6) rotate(-6deg);opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .25s;cursor:pointer}
#vocab.show{opacity:1;transform:scale(1) rotate(-2deg);pointer-events:auto}
#vocab .pic{font-size:78px;line-height:1.1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.2))}
#vocab .en{font:800 34px/1.1 var(--h);color:#5a3f1e;margin-top:6px}
#vocab .zh{font:500 17px/1.3 'Noto Sans TC',sans-serif;color:#8b7150;margin-top:4px}
#vocab .spk{position:absolute;right:10px;top:10px;font-size:18px;opacity:.6}

/* ---------- controls ---------- */
#controls{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:18px;z-index:20}
.nav{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff8e8,#e3cfa2);box-shadow:0 5px 0 #a67d44,0 8px 14px rgba(0,0,0,.4);display:grid;place-items:center;transition:transform .15s}
.nav svg{width:26px;height:26px}
.nav:active{transform:translateY(3px);box-shadow:0 2px 0 #a67d44,0 4px 8px rgba(0,0,0,.4)}
.nav:disabled{opacity:.4;pointer-events:none}
.mid{display:flex;flex-direction:column;align-items:center;gap:8px}
#play{min-width:210px;height:54px;border-radius:30px;background:linear-gradient(180deg,#fff9ea,#efdcb0);border:3px solid #b98c4f;box-shadow:0 5px 0 #8f6430,0 8px 16px rgba(0,0,0,.4);font:800 21px var(--h);color:#5a3f1e;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s}
#play:active{transform:translateY(3px);box-shadow:0 2px 0 #8f6430}
.modes{display:flex;gap:8px}
.mode{height:30px;padding:0 14px;border-radius:15px;font:700 13px var(--h);color:#5a3f1e;background:#f3e6c9;border:2px solid #c8ad7a;box-shadow:0 3px 0 #a67d44;display:flex;align-items:center;gap:6px}
.mode.on{background:var(--rose);color:#fff;border-color:#b24b3a;box-shadow:0 3px 0 #8a3327}
.mode.on.alt{background:var(--teal);border-color:#226a76;box-shadow:0 3px 0 #1b525c}

/* ---------- cover & end overlays ---------- */
.overlay{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,rgba(28,32,68,.5),rgba(10,8,20,.85));transition:opacity .6s;}
.overlay.hide{opacity:0;pointer-events:none}
.cover{width:420px;height:540px;border-radius:14px 22px 22px 14px;background:linear-gradient(160deg,#2c3a75,#151b3f 60%,#0e1230);box-shadow:-10px 0 0 #0b0f24,0 30px 60px rgba(0,0,0,.7),inset 6px 0 0 rgba(255,255,255,.08);position:relative;overflow:hidden;transform:rotate(-4deg);animation:coverin 1s cubic-bezier(.34,1.56,.64,1) both;text-align:center;padding-top:40px}
@keyframes coverin{from{transform:rotate(-14deg) scale(.7) translateY(80px);opacity:0}to{transform:rotate(-4deg);opacity:1}}
.cover .ct{font:800 44px/1.05 var(--h);color:var(--gold);text-shadow:0 3px 0 #7a5300,0 8px 20px rgba(0,0,0,.6);padding:0 30px}
.cover .ct small{display:block;font:700 22px var(--h);color:#f7e5b5;margin-top:6px;text-shadow:none}
.cover .zh{font:500 16px 'Noto Sans TC',sans-serif;color:#b9c3ff;margin-top:8px}
.cover svg{position:absolute;left:0;bottom:0;width:100%;height:280px}
.cover .open{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);height:52px;padding:0 30px;border-radius:26px;background:var(--gold);color:#5a3f1e;font:800 20px var(--h);box-shadow:0 5px 0 var(--gold-dark),0 10px 20px rgba(0,0,0,.5);z-index:2}
.end{text-align:center;color:var(--cream)}
.end h2{font:800 60px var(--h);color:var(--gold);margin:0;text-shadow:0 4px 0 #7a5300}
.end p{font:400 20px var(--b);margin:10px 0 24px;color:#e9e0c8}
.end .open{height:52px;padding:0 30px;border-radius:26px;background:var(--gold);color:#5a3f1e;font:800 20px var(--h);box-shadow:0 5px 0 var(--gold-dark)}
.end .big{font-size:80px;margin-bottom:10px;animation:bob2 2s ease-in-out infinite}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

/* sparkles */
.sp{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff6c8;box-shadow:0 0 8px 2px #ffe58a;pointer-events:none;z-index:18;animation:spark .9s ease-out forwards}
@keyframes spark{0%{transform:scale(1) translateY(0);opacity:1}100%{transform:scale(.1) translateY(-30px);opacity:0}}

/* toast */
#toast{position:absolute;right:26px;bottom:26px;background:rgba(30,20,8,.85);color:#fff2d0;font:400 13px var(--b);padding:8px 14px;border-radius:10px;z-index:25;opacity:0;transition:opacity .3s;max-width:260px}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

    <ellipse cx="80" cy="120" rx="70" ry="30" fill="url(#lg)"/><path d="M40 20 L110 20 L130 72 L20 72Z" fill="#f8e7b8"/><path d="M40 20 L110 20 L130 72 L20 72Z" fill="url(#lg)" opacity=".6"/><rect x="70" y="72" width="10" height="46" fill="#5a3416"/><ellipse cx="75" cy="120" rx="26" ry="8" fill="#5a3416"/></svg>

  <div class="brand"><span>🏮</span>STORYLIGHT</div>
  <div class="stars" id="starsRow"></div>
  <div class="topbtns">
    <button class="round" id="btnZh" title="中文翻譯">中</button>
    <button class="round" id="btnSlow" title="慢速朗讀">🐢</button>

  <div id="stage">

  <div id="toast"></div>

  <div class="overlay" id="coverOv">

      <div class="ct">Dori and the<br>Echo in the Mist<small>國小五～六年級閱讀</small></div>

      <svg viewBox="0 0 420 280" id="coverArt"></svg>
      <button class="open" id="openBook">Open the book ✨</button>

  </div>
</div>

<script src="/elevenlabs-tts-patch.js"></script>
<script>
/* ================= STORY DATA ================= */
const VOCAB = {"triceratops":["🦕","三角龍"],"exploring":["🧭","探索（explore 的現在分詞）"],"valley":["🏞️","山谷"],"ferns":["🌿","蕨類植物（複數）"],"brushed":["🌿","輕擦過（brush 的過去式）"],"separated":["↔️","分開的；走散的"],"special":["✨","特別的"],"branch":["🪵","樹枝"],"crashed":["💥","轟然落下（crash 的過去式）"],"path":["🛤️","小路"],"mist":["🌫️","薄霧；霧氣"],"view":["👁️","視線；視野"],"dripping":["💧","滴水的"],"although":["🔗","雖然；儘管"],"racing":["💓","急速跳動（此處指心跳）"],"farther":["↗️","更遠地"],"footprints":["👣","腳印"],"mud":["🟤","泥土；泥濘"],"narrow":["↔️","狹窄的"],"pointed":["🔺","尖的"],"broad":["↔️","寬闊的"],"rounded":["⭕","圓弧狀的"],"tracks":["👣","足跡；蹤跡"],"evidence":["🔎","證據"],"direction":["🧭","方向"],"faint":["🔉","微弱的"],"cliffs":["⛰️","懸崖（複數）"],"hopeful":["🌤️","充滿希望的"],"noticed":["👀","注意到（notice 的過去式）"],"exactly":["🎯","完全一樣地；精確地"],"echo":["🔊","回音"],"instead":["🔄","反而；代替"],"rushing":["🏃","匆忙奔去"],"shallow":["💧","淺的"],"channel":["〰️","水溝；水道"],"rising":["⬆️","上升中"],"uphill":["⛰️","往上坡"],"shelter":["🌿","遮蔽；庇護"],"sight":["👁️","視線範圍"],"lonely":["💙","孤單的"],"brave":["💛","勇敢的"],"fear":["💭","恐懼"],"steady":["🫶","平穩的"],"signal":["📣","訊號"],"recognized":["👂","認出（recognize 的過去式）"],"relief":["😌","如釋重負；寬慰"],"admitted":["💬","坦白承認（admit 的過去式）"],"choices":["🧭","選擇（複數）"],"clues":["🔎","線索（複數）"],"mother":["🦕","媽媽"],"fern":["🌿","蕨類植物"],"stone":["🪨","石頭"]};
const PAGES = [{"t":"Before the mist","s":"valley","x":"Dori, a young triceratops, was exploring a valley with her mother. Ferns brushed against her legs, and the air smelled of rain. \"Stay where I can see you,\" Mother said. \"If we become separated, stop somewhere safe and use our special call: one long sound, then two short ones.\"","z":"小三角龍朵里正和媽媽探索一座山谷。蕨類輕輕擦過她的腿，空氣中有雨水的氣味。「待在我看得見你的地方。」媽媽說。「如果我們走散了，就在安全的地方停下來，用我們的特別叫聲：一聲長的，再兩聲短的。」"},{"t":"A sudden silence","s":"mist","x":"A branch crashed onto the path between them. Dori stepped back, and thick mist hid her mother from view. \"Mom?\" she called. Only dripping leaves answered. Although her heart was racing, she stopped beside a flat stone. Running without a plan might carry her farther away.","z":"一根樹枝轟然落在她們之間的小路上。朵里退後一步，濃霧遮住了媽媽的身影。「媽媽？」她喊道。回應她的只有樹葉滴水的聲音。雖然心跳很快，她還是停在一塊平坦的石頭旁。毫無計畫地亂跑，可能會讓她離媽媽更遠。"},{"t":"Not every track is a clue","s":"tracks","x":"Several deep footprints crossed the mud nearby. Dori almost followed them, but something looked wrong. These prints were narrow and pointed; her mother left broad, rounded tracks. A large footprint did not always belong to a large friend. She needed better evidence before choosing a direction.","z":"附近的泥地上有幾個深深的腳印。朵里差點就跟了上去，卻覺得有些不對勁。這些腳印又窄又尖；媽媽留下的足跡則寬寬圓圓的。大腳印不一定屬於一位大朋友。決定方向之前，她需要更可靠的證據。"},{"t":"An answer, or an echo?","s":"echo","x":"Dori made their special call and listened carefully. A faint sound returned from the cliffs. For a moment, she felt hopeful. Then she noticed that it copied her exactly. It was an echo, not an answer. She waited and called again instead of rushing toward the sound.","z":"朵里發出她們的特別叫聲，仔細聆聽。懸崖傳回一陣微弱的聲音。有那麼一瞬間，她充滿希望。接著她發現，那聲音跟自己的叫聲一模一樣。那是回音，不是回答。她等了一會兒又叫了一次，沒有急著朝聲音的方向跑去。"},{"t":"A safer place nearby","s":"shelter","x":"Rain began to fill the shallow channel beside the stone. Dori could see the water rising. She moved a few steps uphill to a giant fern, where the ground was dry. The stone was still in sight. This small change gave her shelter without taking her far from the path.","z":"雨水開始流進石頭旁淺淺的水溝。朵里看見水位逐漸上升。她往上坡走了幾步，來到一株巨大蕨類旁，那裡的地面是乾的。她仍看得見那塊石頭。這個小小的調整讓她有了遮蔽，也沒有離小路太遠。"},{"t":"Brave does not mean fearless","s":"courage","x":"Under the fern, Dori felt lonely. She wanted to cry, and a few tears slipped down her face. Being brave did not mean feeling no fear. She took slow breaths until her voice was steady. Then she sent their signal through the mist: one long call and two short ones.","z":"在蕨類底下，朵里覺得很孤單。她好想哭，幾滴眼淚滑過臉頰。勇敢並不代表完全不害怕。她慢慢呼吸，直到聲音平穩下來。接著，她把訊號送進霧裡：一聲長叫，再兩聲短叫。"},{"t":"A voice she recognized","s":"answer","x":"This time, a voice called her name. \"Dori! Stay there. I am coming around the fallen branch.\" She recognized her mother at once. The words were different from her own call, so this could not be an echo. Dori answered from the fern and waited while the heavy footsteps grew closer.","z":"這一次，有個聲音喊出了她的名字。「朵里！待在那裡。我正繞過倒下的樹枝過來。」她立刻認出了媽媽的聲音。那些話與自己的叫聲不同，所以不可能只是回音。朵里從蕨類旁回應，等待沉重的腳步聲越來越近。"},{"t":"More than finding the way","s":"reunion","x":"Mother appeared through the mist and gently touched Dori with her nose. Relief warmed Dori from head to tail. \"I was afraid,\" she admitted. \"And you still made careful choices,\" Mother replied. Together, they returned along the path. Dori had learned to pause, check the clues, and ask for help.","z":"媽媽穿過霧氣出現了，輕輕用鼻子碰了碰朵里。朵里鬆了一口氣，暖意從頭一路傳到尾巴。「我剛才很害怕。」她坦白說。「而你還是做出了謹慎的選擇。」媽媽回答。她們一起沿著小路回去。朵里學會了先停下來、確認線索，再尋求幫助。"}];

  const c=FLOOR[kind];
  return `<svg viewBox="0 0 640 320" preserveAspectRatio="none"><defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="#fbf3df"/></linearGradient></defs>
    <path d="M0 0H640V200Q320 270 0 200z" fill="url(#fl)"/>${Array.from({length:18},(_,i)=>`<path d="M${(i*137)%620+10} ${30+(i*53)%150}q6-14 12 0" stroke="rgba(255,255,255,.35)" stroke-width="2" fill="none"/>`).join('')}</svg>`;
}
function coverArt(){
  document.getElementById('coverArt').innerHTML=`<path d="M0 220Q120 150 260 200T420 180V280H0z" fill="#3c5e8a"/><path d="M0 250Q200 210 420 240V280H0z" fill="#2f4d78"/>
   <g transform="translate(70,30) scale(.95)">${A.fox(150).replace('<svg','<svg x="0" y="0"')}</g><g transform="translate(250,60)">${A.star(110).replace('<svg','<svg x="0" y="0"')}</g>`;
}

// Story-specific art; retain the supplied physical-book engine.
const doriArt=(name,w=210,h=145)=>`<svg width="${w}" viewBox="0 0 ${w} ${h}"><image href="/images/picture-books/dori/${name}.png" width="${w}" height="${h}" preserveAspectRatio="xMidYMax meet"/></svg>`;
PAGES.forEach((p,i)=>{
 BACK[p.s]=()=>`<svg viewBox="0 0 732 376"><image href="/images/picture-books/dori/valley.png" width="732" height="376" preserveAspectRatio="xMidYMid slice"/><rect width="732" height="376" fill="#dbe5df" opacity="${i===0||i===7?.04:i===1?.42:.23}"/></svg>`;
 FLOOR[p.s]=i>=4&&i<=6?'#9aa68a':'#b1aa8c';
 const family=i===0||i===7;
 POPS[p.s]=[
  {x:family?90:180,y:.12,h:doriArt(i===1||i===2||i===3||i===5?'dori-listening':'dori-alert',family?180:220,family?125:150),tag:'triceratops'},
  ...(family?[{x:340,y:.25,h:doriArt('mother',285,195),tag:'mother'}]:[]),
  ...(!family?[{x:30,y:.8,h:doriArt('fern',145,225),tag:'fern'}]:[]),
  ...(i===2?[{x:465,y:.05,h:doriArt('footprints',175,115),tag:'footprints'}]:[]),
  ...(i===1||i===4?[{x:490,y:.15,h:A.rock(125),tag:'stone'}]:[]),
  ...(i===3||i===5?[{x:485,y:.55,h:A.cloud(140),tag:i===3?'echo':'signal',bob:1}]:[]),
  ...(i===6?[{x:415,y:.35,h:doriArt('mother',220,150),tag:'mother'}]:[])
 ];
});
coverArt=function(){document.getElementById('coverArt').innerHTML=`<image href="/images/picture-books/dori/valley.png" width="420" height="280" preserveAspectRatio="xMidYMid slice"/><g transform="translate(20,70)">${doriArt('dori-alert',165,110)}</g><g transform="translate(185,35)">${doriArt('mother',225,155)}</g>`;};

/* ================= STATE ================= */
let page=0, mode='read', playing=false, slow=false, sound=true, tokens=[], utter=null, timers=[], boundaryFired=false;
const $=id=>document.getElementById(id);
const S=window.speechSynthesis;

/* ---------- scale canvas ---------- */
function fit(){const s=Math.min(innerWidth/1040,innerHeight/660);$('app').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

/* ---------- stars ---------- */
const sr=$('starsRow');PAGES.forEach(()=>sr.appendChild(document.createElement('i')));
function drawStars(){[...sr.children].forEach((el,i)=>{el.classList.toggle('on',i<=page);el.classList.toggle('now',i===page)})}

/* ---------- speech ---------- */
let voice=null;
function pickVoice(){const v=S.getVoices();voice=v.find(x=>/en[-_]US/i.test(x.lang)&&/Google|Samantha|Aria|Jenny|Zira|Natural/i.test(x.name))||v.find(x=>/en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}
if(S){pickVoice();S.onvoiceschanged=pickVoice}
function say(text,cb){
  if(!S||!sound){cb&&cb();return}
  S.cancel();const u=new SpeechSynthesisUtterance(text);if(voice)u.voice=voice;u.lang='en-US';u.rate=slow?.65:.88;u.pitch=1.05;u.onend=()=>cb&&cb();S.speak(u);return u;
}

/* ---------- render page ---------- */
function tokenize(text){
  tokens=[];let re=/[A-Za-z']+|[^A-Za-z'\s]+|\s+/g,m,i=0,html='';
  while((m=re.exec(text))){const s=m[0];
    if(/^[A-Za-z']+$/.test(s)){const key=s.toLowerCase().replace(/^'|'$/g,'');const v=VOCAB[key]?' v':'';html+=`<span class="w${v}" data-i="${i}" data-w="${key}">${s}</span>`;tokens.push({i,start:m.index,end:m.index+s.length,w:key});i++}
    else html+=s.replace(/\n/g,' ');
  }
  return html;
}
function render(dir){
  const p=PAGES[page];
  $('pageno').textContent=`PAGE ${page+1} OF ${PAGES.length}`;
  $('title').textContent=p.t;$('text').innerHTML=tokenize(p.x);$('zh').textContent=p.z;
  $('backdrop').innerHTML=BACK[p.s]();$('floor').innerHTML=floorSvg(p.s);
  const box=$('pops');box.innerHTML='';
  POPS[p.s].forEach((o,k)=>{
    const d=document.createElement('div');d.className='pop down'+(o.bob?' bob':'');
    d.style.left=Math.round(o.x*.84)+'px';d.style.bottom=(70+o.y*190)+'px';d.style.zIndex=Math.round((1-o.y)*10);
    d.innerHTML=o.h+'<div class="shadow"></div>'+(o.tag?`<div class="tag" style="top:-34px">${o.tag}</div>`:'');
    d.addEventListener('pointerdown',e=>{e.stopPropagation();const key=(o.tag||'').toLowerCase();
      d.style.transition='transform .2s';d.style.transform='rotateX(-60deg) scale(1.08)';setTimeout(()=>{d.style.transition='';d.style.transform=''},220);
      if(o.tag){showVocab(key,d)}});
    box.appendChild(d);
    setTimeout(()=>d.classList.remove('down'),120+k*90);
  });
  drawStars();
  $('prev').disabled=page===0;
  $('card').classList.remove('hide');
  setPlayBtn();
}
function go(n,dir){
  if(n<0)return;
  stopRead(true);
  if(n>=PAGES.length){$('endOv').classList.remove('hide');return}
  const sh=$('sheet');sh.className='sheet go'+(dir<0?' back':'');
  document.querySelectorAll('.pop').forEach(p=>p.classList.add('down'));
  $('card').classList.add('hide');
  setTimeout(()=>{page=n;render(dir);if(mode==='read'&&autoRead)startRead()},480);
  setTimeout(()=>{sh.className='sheet'},950);
}

/* ---------- read to me with word highlight ---------- */
let autoRead=true;
function clearHl(){document.querySelectorAll('.w.hl').forEach(e=>e.classList.remove('hl'));timers.forEach(clearTimeout);timers=[]}
function hl(i){clearHl();const el=document.querySelector(`.w[data-i="${i}"]`);if(el){el.classList.add('hl')}}
function startRead(){
  if(!S||!sound){toast('此瀏覽器不支援語音，請切換到「I\'ll read」模式');return}
  S.cancel();clearHl();const text=PAGES[page].x;
  utter=new SpeechSynthesisUtterance(text);if(voice)utter.voice=voice;utter.lang='en-US';utter.rate=slow?.65:.88;utter.pitch=1.05;
  boundaryFired=false;
  utter.onboundary=e=>{if(e.name&&e.name!=='word')return;boundaryFired=true;timers.forEach(clearTimeout);timers=[];
    const t=tokens.find(t=>e.charIndex>=t.start&&e.charIndex<t.end)||tokens.find(t=>t.start>=e.charIndex);if(t)hl(t.i)};
  utter.onend=()=>{playing=false;clearHl();setPlayBtn();document.querySelectorAll('.w').forEach(w=>w.classList.remove('said'));toast(page<PAGES.length-1?'Tap ▶ next to turn the page  →':'Tap → to finish the book')};
  utter.onerror=()=>{playing=false;setPlayBtn()};
  playing=true;setPlayBtn();S.speak(utter);
  /* fallback timing if no boundary events (e.g. Safari) */
  setTimeout(()=>{if(boundaryFired||!playing)return;const per=(slow?520:340);tokens.forEach((t,k)=>timers.push(setTimeout(()=>{if(playing)hl(t.i)},k*per)))},700);
}
function stopRead(hard){if(S)S.cancel();playing=false;paused=false;clearHl();setPlayBtn()}
let paused=false;
function setPlayBtn(){
  const b=$('play');
  if(mode==='self'){$('playIcon').textContent='🔈';$('playTxt').textContent='Read this page';return}
  if(playing&&!paused){$('playIcon').textContent='❚❚';$('playTxt').textContent='Pause'}
  else if(paused){$('playIcon').textContent='▶';$('playTxt').textContent='Keep reading'}
  else{$('playIcon').textContent='▶';$('playTxt').textContent='Read to me'}
}
$('play').onclick=()=>{
  if(mode==='self'){startRead();return}
  if(playing&&!paused){S.pause();paused=true;setPlayBtn();return}
  if(paused){S.resume();paused=false;setPlayBtn();return}
  startRead();
};

/* ---------- word / vocab ---------- */
$('text').addEventListener('click',e=>{const w=e.target.closest('.w');if(!w)return;e.stopPropagation();
  if(playing){stopRead()}
  w.classList.add('said');setTimeout(()=>w.classList.remove('said'),700);
  showVocab(w.dataset.w,null,w.textContent);
});
function showVocab(key,anchor,word){
  const v=VOCAB[key];const box=$('vocab');
  say(word||key);
  if(!v){box.classList.remove('show');return}
  box.querySelector('.pic').textContent=v[0];box.querySelector('.en').textContent=word||key;box.querySelector('.zh').textContent=v[1];
  box.classList.add('show');clearTimeout(box._t);box._t=setTimeout(()=>box.classList.remove('show'),2600);
}
$('vocab').onclick=e=>{e.stopPropagation();say($('vocab').querySelector('.en').textContent)};
$('card').addEventListener('click',e=>{if(e.target.closest('.w'))return;$('card').classList.toggle('zoom')});

/* ---------- modes / buttons ---------- */
$('mRead').onclick=()=>{mode='read';autoRead=true;$('mRead').classList.add('on');$('mSelf').classList.remove('on','alt');setPlayBtn()};
$('mSelf').onclick=()=>{mode='self';autoRead=false;stopRead();$('mSelf').classList.add('on','alt');$('mRead').classList.remove('on');setPlayBtn();toast('你自己讀，點單字可以聽發音')};
$('btnZh').onclick=()=>{$('zh').classList.toggle('show');$('btnZh').classList.toggle('off',!$('zh').classList.contains('show'))};$('btnZh').classList.add('off');
$('btnSlow').onclick=()=>{slow=!slow;$('btnSlow').classList.toggle('off',!slow);toast(slow?'慢速朗讀 🐢':'正常速度');if(playing)startRead()};$('btnSlow').classList.add('off');
$('btnSound').onclick=()=>{sound=!sound;$('btnSound').textContent=sound?'🔊':'🔇';if(!sound)stopRead()};
$('prev').onclick=()=>go(page-1,-1);$('next').onclick=()=>go(page+1,1);
addEventListener('keydown',e=>{if(e.target.closest('button,[role=button]')||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='ArrowRight')go(page+1,1);if(e.key==='ArrowLeft')go(page-1,-1);if(e.key===' '){e.preventDefault();$('play').click()}});
$('openBook').onclick=()=>{$('coverOv').classList.add('hide');page=0;render(1);setTimeout(()=>{if(mode==='read')startRead()},900)};
$('again').onclick=()=>{$('endOv').classList.add('hide');page=0;render(1);setTimeout(()=>{if(mode==='read')startRead()},900)};
document.addEventListener('click',()=>$('vocab').classList.remove('show'));

/* ---------- sparkles ---------- */
let last=0;
$('stage').addEventListener('pointermove',e=>{const now=performance.now();if(now-last<40)return;last=now;
  const r=$('app').getBoundingClientRect(),s=r.width/1040;const d=document.createElement('div');d.className='sp';
  d.style.left=((e.clientX-r.left)/s-3+(Math.random()*10-5))+'px';d.style.top=((e.clientY-r.top)/s-3)+'px';$('app').appendChild(d);setTimeout(()=>d.remove(),900)});

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800)}

coverArt();render(1);$('card').classList.add('hide');
</script>
<script src="/picture-books/dori-audio-items.js"></script>
<script src="/picture-books/pip-enhancements.js"></script>
</body>
